name: 测试

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "state/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pandas numpy PyYAML requests pytest
      - run: python -m pytest -q
      - name: 演示数据全流程
        run: python -m tracker.main --demo
