name: 更新数据并部署

on:
  schedule:
    # 北京时间工作日 20:17（UTC 12:17），收盘后东方财富估值数据已更新
    - cron: "17 12 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "state/**"
      - "**.md"

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

env:
  # Cloudflare Pages 项目名，可用仓库变量 CLOUDFLARE_PROJECT_NAME 覆盖
  CF_PROJECT: ${{ vars.CLOUDFLARE_PROJECT_NAME || 'dividend-index-tracker' }}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      # 配置了 Cloudflare 时默认不再部署 GitHub Pages；仓库变量 ALSO_GITHUB_PAGES=true 可两边都部署
      github_pages: ${{ steps.cf.outputs.enabled != 'true' || vars.ALSO_GITHUB_PAGES == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: 检查是否配置 Cloudflare
        id: cf
        run: echo "enabled=${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 拉取数据、计算信号并发送提醒
        env:
          TZ: Asia/Shanghai
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL || (steps.cf.outputs.enabled == 'true' && format('https://{0}.pages.dev/', env.CF_PROJECT)) || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BARK_URL: ${{ secrets.BARK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python -m tracker.main

      - name: 保存信号状态
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          if git diff --cached --quiet; then
            echo "状态无变化"
          else
            git commit -m "chore: 更新信号状态 $(TZ=Asia/Shanghai date +%F)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: 部署到 Cloudflare Pages
        if: steps.cf.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 首次运行时创建项目；已存在会报错，忽略即可
          npx --yes wrangler@4 pages project create "$CF_PROJECT" --production-branch=main || true
          npx --yes wrangler@4 pages deploy web --project-name="$CF_PROJECT" --branch=main --commit-dirty=true

      - uses: actions/upload-pages-artifact@v3
        if: steps.cf.outputs.enabled != 'true' || vars.ALSO_GITHUB_PAGES == 'true'
        with:
          path: web

  deploy:
    needs: update
    if: needs.update.outputs.github_pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
