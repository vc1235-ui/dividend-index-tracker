name: 更新数据并部署

on:
  schedule:
    # GitHub 定时任务按 UTC 计；繁忙时可能延迟，第二次运行兜底。两次都是增量运行，
    # 同一数据日期只在第一次处理时发送提醒，不会重复
    - cron: "7 8 * * 1-5"    # 北京时间周一至周五 16:07（收盘后）
    - cron: "17 18 * * 1-5"  # 北京时间次日凌晨 02:17（周二至周六），补上 16:07 时尚未发布的数据
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "state/**"
      - "**.md"

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

env:
  # Cloudflare Pages 项目名，可用仓库变量 CLOUDFLARE_PROJECT_NAME 覆盖
  CF_PROJECT: ${{ vars.CLOUDFLARE_PROJECT_NAME || 'dividend-index-tracker' }}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      # 配置了 Cloudflare 时默认不再部署 GitHub Pages；仓库变量 ALSO_GITHUB_PAGES=true 可两边都部署
      github_pages: ${{ steps.cf.outputs.enabled != 'true' || vars.ALSO_GITHUB_PAGES == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: 检查是否配置 Cloudflare
        id: cf
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' || vars.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          echo "CLOUDFLARE_API_TOKEN（Secret）已配置: $HAS_TOKEN"
          echo "CLOUDFLARE_ACCOUNT_ID（Secret 或 Variable）已配置: $HAS_ACCOUNT"
          if [ "$HAS_TOKEN" = true ] && [ "$HAS_ACCOUNT" = true ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            if [ "$HAS_TOKEN" = true ] || [ "$HAS_ACCOUNT" = true ]; then
              echo "::warning::Cloudflare 配置不完整，本次不部署到 Cloudflare。请在 Settings → Secrets and variables → Actions → Repository secrets 中检查名称"
            fi
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      # 估值历史缓存：每次运行恢复最近一次的缓存，结束时保存新的，实现增量更新
      - name: 恢复估值历史缓存
        uses: actions/cache@v4
        with:
          path: .cache/history
          key: history-${{ github.run_id }}
          restore-keys: history-

      - name: 拉取数据、计算信号并发送提醒
        env:
          TZ: Asia/Shanghai
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL || (steps.cf.outputs.enabled == 'true' && format('https://{0}.pages.dev/', env.CF_PROJECT)) || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BARK_URL: ${{ secrets.BARK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python -m tracker.main

      - name: 保存信号状态
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          if git diff --cached --quiet; then
            echo "状态无变化"
          else
            git commit -m "chore: 更新信号状态 $(TZ=Asia/Shanghai date +%F)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: 部署到 Cloudflare Pages
        if: steps.cf.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 去掉复制粘贴时带入的空格/换行，并校验 Account ID 格式（32 位十六进制）
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          if ! printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -Eq '^[0-9a-fA-F]{32}$'; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID 格式不对：去掉空白后长度为 ${#CLOUDFLARE_ACCOUNT_ID}，应为 32 位十六进制。请在 Cloudflare 控制台 Workers & Pages 页右侧复制 Account ID，只粘贴这 32 个字符"
            exit 1
          fi
          export CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN
          # 项目不存在时才创建（首次运行）
          if ! npx --yes wrangler@4 pages project list 2>/dev/null | grep -qE "(^|[^-[:alnum:]])${CF_PROJECT}([^-[:alnum:]]|$)"; then
            npx --yes wrangler@4 pages project create "$CF_PROJECT" --production-branch=main || true
          fi
          npx --yes wrangler@4 pages deploy web --project-name="$CF_PROJECT" --branch=main --commit-dirty=true

      - uses: actions/upload-pages-artifact@v3
        if: steps.cf.outputs.enabled != 'true' || vars.ALSO_GITHUB_PAGES == 'true'
        with:
          path: web

  deploy:
    needs: update
    if: needs.update.outputs.github_pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
